<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader</title>
    <style>
        body {
            background: #ffffff;
            color: #333;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            color: #333;
            padding: 30px 20px;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .header h2 {
            margin: 0;
            font-size: 22px;
            color: #111;
            font-weight: bold;
        }
        .header h2 span {
            color: #6c5ce7;
        }
        .input-box {
            background: #f1f3f6;
            border: 1px solid #dfe4ea;
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 6px;
            margin-bottom: 18px;
        }
        .input-box input {
            flex-grow: 1;
            border: none;
            outline: none;
            padding: 12px;
            font-size: 15px;
            background: transparent;
            color: #333;
        }
        .input-box button {
            background: #fff;
            border: 1px solid #dfe4ea;
            color: #6c5ce7;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .download-btn {
            width: 100%;
            background: linear-gradient(90deg, #a29bfe, #6c5ce7);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(108,92,231,0.3);
            margin-bottom: 25px;
        }
        .platforms {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .platforms p {
            margin: 0 0 12px 0;
            font-size: 13px;
            color: #6c757d;
            font-weight: 500;
        }
        .platform-icons {
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 22px;
        }
        #optionsSection {
            display: none;
            margin-top: 20px;
            background: #f1f2f6;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #dfe4ea;
        }
        #optionsSection p {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #2f3542;
            font-weight: bold;
        }
        .format-btn-mp4 {
            width: 100%;
            background: #2ed573;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .format-btn-mp3 {
            width: 100%;
            background: #1e90ff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        /* Modal Styles */
        #adModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .ad-content {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .ad-content h3 {
            color: #6c5ce7;
            margin-top: 0;
        }
        #closeAdBtn {
            background: #ccc;
            color: #666;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: not-allowed;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
  <!-- হেডার বা টাইটেল -->
  <div class="header">
    <h2>TikTok <span>Video Downloader</span></h2>
    <span style="font-size: 22px; cursor: pointer;" onclick="alert('Menu clicked!')">☰</span>
  </div>

  <!-- ইনপুট ও পেস্ট বক্স -->
  <div class="input-box">
    <input type="text" id="videoUrl" placeholder="Enter web address or link">
    <button onclick="pasteLink()">Paste 📋</button>
  </div>

  <!-- মূল ডাউনলোড বাটন -->
  <button class="download-btn" onclick="triggerFirstAd()">⬇ Download</button>

  <!-- প্ল্যাটফর্ম সাপোর্ট সেকশন -->
  <div class="platforms">
    <p>Currently we support downloading from the following platforms</p>
    <div class="platform-icons">
      <span>🎵</span>
      <span>📘</span>
      <span>📷</span>
      <span>💜</span>
      <span>💛</span>
      <span>🐦</span>
    </div>
  </div>

  <!-- ফরম্যাট সিলেকশন সেকশন -->
  <div id="optionsSection">
    <p>Select Format & Download:</p>
    <button class="format-btn-mp4" onclick="triggerSecondAd('MP4 Video')">📥 Download MP4 (No Watermark)</button>
    <button class="format-btn-mp3" onclick="triggerSecondAd('MP3 Audio')">🎵 Download MP3 (Audio)</button>
  </div>
</div>

<!-- বিজ্ঞাপন পপ-আপ উইন্ডো (Ad Modal) -->
<div id="adModal">
  <div class="ad-content">
    <h3>Sponsored Advertisement</h3>
    <p style="font-size: 14px; color: #555; margin: 15px 0;">Please wait <span id="countdown" style="font-weight: bold; color: #e74c3c;">3</span> seconds...</p>
    <button id="closeAdBtn" disabled>Please wait...</button>
  </div>
</div>

<script>
  const input = document.getElementById('videoUrl');
  const optionsSection = document.getElementById('optionsSection');
  const adModal = document.getElementById('adModal');
  const countdownSpan = document.getElementById('countdown');
  const closeAdBtn = document.getElementById('closeAdBtn');

  let currentStep = '';

  async function pasteLink() {
    try {
      const text = await navigator.clipboard.readText();
      if(text) input.value = text;
    } catch(e) {
      let t = prompt("লিংকটি এখানে পেস্ট করুন:");
      if(t) input.value = t;
    }
  }

  function triggerFirstAd() {
    if(input.value.trim() === "") {
      alert("দয়া করে আগে টিকটক লিংক দিন!");
      return;
    }
    currentStep = 'step1_finished';
    startAdCountdown();
  }

  function triggerSecondAd(formatType) {
    currentStep = 'step2_finished_' + formatType;
    startAdCountdown();
  }

  function startAdCountdown() {
    adModal.style.display = "flex";
    let timeLeft = 3;
    countdownSpan.innerText = timeLeft;
    closeAdBtn.disabled = true;
    closeAdBtn.style.background = "#ccc";
    closeAdBtn.style.color = "#666";
    closeAdBtn.style.cursor = "not-allowed";
    closeAdBtn.innerText = "Please wait...";

    let timer = setInterval(() => {
      timeLeft--;
      countdownSpan.innerText = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timer);
        closeAdBtn.disabled = false;
        closeAdBtn.style.background = "#6c5ce7";
        closeAdBtn.style.color = "white";
        closeAdBtn.style.cursor = "pointer";
        closeAdBtn.innerText = "Close Ad & Continue ✖";
      }
    }, 1000);
  }

  closeAdBtn.onclick = function() {
    if(closeAdBtn.disabled) return;
    adModal.style.display = "none";

    if(currentStep === 'step1_finished') {
      optionsSection.style.display = "block";
    } else if(currentStep.startsWith('step2_finished')) {
      let format = cu।rrentStep.split('_')[2] + " " + currentStep.split('_')[3];
      alert("সফলভাবে বিজ্ঞাপন শেষ হয়েছে! এখন আপনার " + format + " ডাউনলোড শুরু হচ্ছে...");
    }
  };
</script>

</body>
  </html>
